name: validator-ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validator and ISA dependencies
        run: python -m pip install '.[isa]'
      - name: Run validator tests
        run: python -m unittest discover -s validator/tests
      - name: Check installed command outside checkout
        working-directory: /tmp
        run: isa-phm-validate --help
